[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FedSCVI"
version = "1.0.0"
description = "FedSCVI: A Flower for federated single cell variational inference."
license = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "dmalpetti"

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.flwr.app.config]
strategy = "availability" #"fairness"/"privacy"
dp_noise_multiplier = 1
dp_clip_norm = 1.0

# Main simulation parameters
num_rounds =10
num_local_epochs = 3

early_stopping_patience = 3
early_stopping_min_delta = 10.0

# Paths for input and output files
client_folder_path = "data_federated/data_client_{partition_id}"
server_folder_path = "data_federated/data_server"

all_techs_file = "all_techs.json"
all_genes_file = "all_genes.json"
top2k_genes_file = "top2k_genes.json"

model_file_path = "model_federated"
loss_plot_path = "loss_plot.png"

fairness_strategy_name = "qffl" #"qffl/adaptive_qffl/uniform/fedavg_ploss"
fairness_q = 5.0         # starting q
fairness_q_alpha = 0.5   # step size — how aggressively q reacts each round
fairness_q_min = 0.0      # floor: never goes below plain-FedAvg-like weighting
fairness_q_max = 5.0      # ceiling: cap on how aggressive q can get

# Client-availability simulation (only used by strategy = "availability")
participation_regime = "full"   # "full" / "random" / "size_correlated"
availability_q = 5.0             # 0.0 -> FedAvg-equivalent weighting; e.g. 5.0 -> q-FFL
availability_p = 0.7              # per-round availability prob. for "random"
availability_size_threshold = 800 # cells; below -> "small" client for "size_correlated"
availability_p_small = 0.5        # availability prob. for small clients ("size_correlated")
availability_p_large = 0.9        # availability prob. for large clients ("size_correlated")
availability_seed = 42            # RNG seed for the per-round dropout draws
availability_bootstrap_rounds = 1 # rounds run at full participation before dropout starts

# Model architecture parameters
use_layer_norm = "both" 
use_batch_norm = "none"
encode_covariates = true
dropout_rate = 0.2
n_layers = 2

# SecAgg+ parameters
num_shares = 3                   
reconstruction_threshold = 2     

#client_folder_path = "."

# These settings are for setting the federated simulation that runs locally on your laptopt

